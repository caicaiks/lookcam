services:
  lookcam:
    build:
      context: ./app
    image: lookcam:latest
    container_name: lookcam
    restart: unless-stopped

    # 宿主机端口和容器内端口用同一个变量，改一个数字就够
    ports:
      - "${PORT:-8420}:${PORT:-8420}"

    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      # 容器内路径，别改（由下面的 volumes 映射进来）
      WATCH_DIR: "/media/rec"
      DATA_DIR: "/data"
      # 端口只作为默认值。在「设置」页改过就以 settings.json 为准，
      # 因为那个值会被 settings.json 覆盖（改完要重启容器）
      PORT: "${PORT:-8420}"

    volumes:
      # 录像目录：只读挂载，容器永远不往里写东西
      - "${WATCH_DIR_HOST:?请在 .env 里设置 WATCH_DIR_HOST}:/media/rec:ro"
      # 索引和缩略图缓存
      - "${DATA_DIR_HOST:-/volume1/docker/lookcam}:/data"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-8420}/api/status"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 20s
